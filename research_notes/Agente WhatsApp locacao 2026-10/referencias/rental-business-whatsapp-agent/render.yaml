services:
  - type: web
    name: whatsapp-business-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    envVars:
      - key: WHATSAPP_AGENT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: GROQ_LLM_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_STT_MODEL
        value: whisper-large-v3-turbo
      - key: DEEPGRAM_TTS_MODEL
        value: aura-2-thalia-en
      - key: SEED_DEMO
        value: "true"
      - key: OTEL_CONSOLE_EXPORTER
        value: "false"
